name: Mac App Store

# Builds the Mac app for the Mac App Store and uploads it to App Store Connect. Run it by hand from the
# Actions tab. Signing is cloud-managed through the App Store Connect API key in the repository
# secrets, so no certificate or profile is kept here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macappstore
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check the secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # The page corner model goes into the app, as in the iPhone upload.
      - name: Fetch the corner model
        run: bash scripts/fetch_docaligner.sh
      # Same pinned XcodeGen as the mac-store job in ci.yml.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the strings
        run: python3 scripts/gen_l10n.py --ship
      - name: Write the app's project
        run: |
          xcodegen generate --spec mac/project.yml
          plutil -replace CFBundleLocalizations -json "$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))' < l10n/out/languages.mac.txt)" mac/LazyScanMacApp/Info.plist
      - name: Write the API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8"
      # The archive is signed ad hoc, which keeps the sandbox entitlements in the binary, and signed for real on export:
      # an automatically signed archive wants a development profile, which needs a registered Mac, and CI has none. The
      # export makes the signed installer package too, with the cloud-managed distribution certificates. The run number
      # is the build number, so every upload gets a new one.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project mac/LazyScanMacApp.xcodeproj \
            -scheme LazyScanMacApp \
            -configuration Release \
            -destination generic/platform=macOS \
            -archivePath "$RUNNER_TEMP/LazyScan.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
      # ONNX Runtime's package wraps a static library as a framework. It is already linked into the
      # app, but Xcode still copies the wrapper into Frameworks/, and App Store Connect rejects it as
      # unsigned code. The export signs the app again.
      - name: Drop ONNX Runtime's framework copy
        run: |
          app="$RUNNER_TEMP/LazyScan.xcarchive/Products/Applications/Lazy Scan.app"
          rm -rf "$app/Contents/Frameworks/onnxruntime.framework"
          rmdir "$app/Contents/Frameworks" 2>/dev/null || true
      - name: Sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LazyScan.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
