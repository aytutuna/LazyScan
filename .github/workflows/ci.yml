name: CI
on: push
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          $PSVersionTable.PSVersion.ToString()
          git config --get core.autocrlf
          $m = Get-Content store\windows\Package.appxmanifest -Raw
          "type $($m.GetType().FullName) len $($m.Length)"
          $p = '(?s)(<Identity[^>]*?Version=")[^"]*(")'
          "match $($m -match $p)"
          "regex $([regex]::IsMatch($m, $p))"
          "plain $($m.Contains('Version=""1.0.0.0""'))"
          $i = $m.IndexOf('<Identity')
          "at $i"
          if ($i -ge 0) { ($m.Substring($i, 160) -replace "`r", '\r' -replace "`n", '\n') }
          [BitConverter]::ToString([Text.Encoding]::UTF8.GetBytes($m.Substring(0, 40)))
