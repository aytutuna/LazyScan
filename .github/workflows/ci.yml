name: CI
on: push
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        continue-on-error: true
      - shell: bash
        run: bash scripts/fetch_docaligner.sh
      - shell: pwsh
        run: |
          $lines = Get-Content scripts/make_msix.ps1
          $i = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -like '*$identityVersion = *' })
          $probe = '    Write-Host "type $($manifest.GetType().FullName) count $(@($manifest).Count) len $($manifest.Length) at $("$manifest".IndexOf(''<Identity''))"; Write-Host ("$manifest".Substring(0, [Math]::Min(1300, "$manifest".Length)))'
          $lines = $lines[0..($i-1)] + $probe + $lines[$i..($lines.Count-1)]
          Set-Content scripts/make_msix.ps1 $lines
          scripts/make_msix.ps1 -Out "$env:RUNNER_TEMP\msix" -Arch x64 -IdentityName Aytu.LazyScan -Publisher 'CN=00000000-0000-0000-0000-000000000000' -PublisherDisplayName Aytu
